<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <article class="text--justified">
            <header><h2>#{messages['nav.clients']}</h2></header>

            <h:dataTable value="#{clientList.clients.clients}" var="client"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">
                <h:column>
                    <f:facet name="header">Login</f:facet>
                    <h:outputText value="#{client.login}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">#{messages.delete}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{messages.delete}"
                                         action="#{clientList.deleteAction(client)}"/>
                    </h:form>
                </h:column>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
