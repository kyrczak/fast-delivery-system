<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{parcelCreate.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>#{messages['create.parcel']} - #{messages.warehouse}</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data" id="form">
                <h:messages/>
                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn" value="#{messages.previous}" immediate="true"
                                         action="#{parcelCreate.goToBasicAction()}"/>
                    </div>
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn" value="#{messages.next}"
                                         action="#{parcelCreate.goToImageAction()}"/>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 p-2">
                        <fieldset>
                            <legend class="form-label fs-6">#{messages.warehouse}:</legend>
                            <!-- Instead of ui:repeat the h:selectOneRadio with f:selectItems can be used but then
                            Faces renders table or list and custom styling with CSS libraties can be troublesome. -->
                            <h:selectOneRadio id="warehouse"
                                              layout="pageDirection"
                                              value="#{parcelCreate.parcel.warehouse}"
                                              converter="warehouseModelConverter"
                                              binding="#{warehouseInput}"
                                              styleClass="#{warehouseInput.valid ? 'form-control' : 'is-invalid form-control'}"
                                              enabledClass="form-check-label">
                                <f:selectItems value="#{parcelCreate.warehouses}"
                                               var="warehouse"
                                               itemValue="#{warehouse}"
                                               itemLabel="#{warehouse.name}"/>
                            </h:selectOneRadio>
                            <h:message for="warehouse" styleClass="invalid-feedback"/>
                        </fieldset>
                    </div>
                </div>

                <div class="row">
                    <div class="col-2 p-2 text-center">
                        <h:button styleClass="btn btn-primary" value="#{messages.create}" disabled="true"/>
                    </div>
                    <div class="col-2 p-2 text-center">
                        <h:commandButton styleClass="btn btn-secondary" value="#{messages.cancel}"
                                         action="#{parcelCreate.cancelAction()}" immediate="true"/>
                    </div>
                </div>
            </h:form>
        </article>
    </ui:define>

</ui:composition>
